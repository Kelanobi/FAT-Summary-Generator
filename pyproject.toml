[project]
name = "fat-summary-app"
version = "1.5.0"
description = "Offline FAT report extraction and executive summary generation prototype."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0",
  "PyMuPDF>=1.24",
  "Jinja2>=3.1",
  "reportlab>=5.0",
  "playwright>=1.61",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
